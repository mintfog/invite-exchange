# 推到 main 就自动测试、构建、迁移数据库并部署到 Cloudflare Workers。
# 需要在仓库 Settings → Secrets and variables → Actions 里设好 CLOUDFLARE_API_TOKEN。
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:worker
      - run: npm run build
      - run: npm test

  deploy:
    # 只有推到 main（或手动触发）才部署；PR 只跑测试
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::还没设置 CLOUDFLARE_API_TOKEN，见 README 的「自动部署」一节"
            exit 1
          fi
      - run: npm run build
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply invite-exchange --remote
      - name: Deploy
        run: npx wrangler deploy
